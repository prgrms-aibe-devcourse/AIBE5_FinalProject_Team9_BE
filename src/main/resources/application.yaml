spring:
  application:
    name: grimgate-backend

  profiles:
    active: local
    include: secret

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY:dummy}
        secret-key: ${AWS_SECRET_KEY:dummy}
      s3:
        bucket: ${AWS_S3_BUCKET:dummy}

  jackson:
    serialization:
      write-dates-as-timestamps: false

toss:
  secret-key: ${TOSS_SECRET_KEY:dummy}
  webhook-secret-key: ${TOSS_WEBHOOK_SECRET:dummy_webhook_secret_key}

gemini:
  api-key: ${GEMINI_API_KEY:dummy_gemini_api_key}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

jwt:
  secret: ${JWT_SECRET:dummySecretKeyLocalTestAtLeastThirtyTwoBytesLong}
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:3600000}
  refresh-token-validity-ms: ${JWT_REFRESH_TOKEN_VALIDITY_MS:86400000}
---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false