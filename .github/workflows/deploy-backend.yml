name: Deploy Backend

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew bootJar -x test

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app/backend"
          strip_components: 2

      - name: Restart app
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            pkill -f grimgate || true
            sleep 2
            source /home/ubuntu/app/.env
            nohup java -jar /home/ubuntu/app/backend/*.jar \
              --spring.profiles.active=prod \
              --spring.config.additional-location=/home/ubuntu/app/ \
              > /home/ubuntu/app/backend/app.log 2>&1 &