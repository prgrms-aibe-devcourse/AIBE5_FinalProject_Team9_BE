version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: grimgate-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: grimgate-mysql
    environment:
      MYSQL_ROOT_PASSWORD: aibe5
      MYSQL_DATABASE: grimgate
    ports:
      - "3306:3306"
    restart: unless-stopped
